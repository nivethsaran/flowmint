services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point to Supabase}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?DATABASE_USERNAME is required}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      APP_DEVICE_TOKEN: ${APP_DEVICE_TOKEN:-dev-device-token-change-me}
    ports:
      - "127.0.0.1:8080:8080"
  frontend:
    build: ./frontend
    environment:
      FLOWMINT_API_URL: http://backend:8080
      FLOWMINT_DEVICE_TOKEN: ${APP_DEVICE_TOKEN:?APP_DEVICE_TOKEN is required}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
