services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point to Supabase}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?DATABASE_USERNAME is required}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      APP_DEVICE_TOKEN: ${APP_DEVICE_TOKEN:?APP_DEVICE_TOKEN is required}
      FLOWMINT_AUTH_USERNAME: ${FLOWMINT_AUTH_USERNAME:?FLOWMINT_AUTH_USERNAME is required}
      FLOWMINT_AUTH_PASSWORD: ${FLOWMINT_AUTH_PASSWORD:?FLOWMINT_AUTH_PASSWORD is required}
      FLOWMINT_TOTP_SECRET: ${FLOWMINT_TOTP_SECRET:?FLOWMINT_TOTP_SECRET is required}
      FLOWMINT_LLM_BASE_URL: ${FLOWMINT_LLM_BASE_URL:?FLOWMINT_LLM_BASE_URL is required (OpenAI-compatible endpoint, e.g. https://host/v1)}
      FLOWMINT_LLM_API_KEY: ${FLOWMINT_LLM_API_KEY:?FLOWMINT_LLM_API_KEY is required}
      FLOWMINT_LLM_MODEL: ${FLOWMINT_LLM_MODEL:-default}
      FLOWMINT_TIMEZONE: ${FLOWMINT_TIMEZONE:-Asia/Kolkata}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8080:8080"
  frontend:
    build: ./frontend
    environment:
      FLOWMINT_API_URL: http://backend:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
