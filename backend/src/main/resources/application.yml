spring:
  application:
    name: flowmint
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: Flowmint Supabase baseline
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  device-token: ${APP_DEVICE_TOKEN}
  auth:
    username: ${FLOWMINT_AUTH_USERNAME}
    password: ${FLOWMINT_AUTH_PASSWORD}
    totp-secret: ${FLOWMINT_TOTP_SECRET}
