spring:
  application:
    name: flowmint
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: Flowmint Supabase baseline
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  timezone: ${FLOWMINT_TIMEZONE:Asia/Kolkata}
  device-token: ${APP_DEVICE_TOKEN}
  auth:
    username: ${FLOWMINT_AUTH_USERNAME}
    password: ${FLOWMINT_AUTH_PASSWORD}
    totp-secret: ${FLOWMINT_TOTP_SECRET}
  llm:
    base-url: ${FLOWMINT_LLM_BASE_URL}
    api-key: ${FLOWMINT_LLM_API_KEY}
    model: ${FLOWMINT_LLM_MODEL:default}
    timeout: 120s
    max-tokens: 400
    max-attempts: 5
    retry-delays: 1m,5m,15m,60m
    review-confidence-threshold: 0.7
    claim-timeout: 5m
    queue-capacity: 500
